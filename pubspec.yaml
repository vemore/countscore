name: countscore
description: "CountScore - A Flutter application for score tracking and management"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# License
license: MIT

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.0+9

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.0
  flex_color_picker: ^4.0.0
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  file_picker: ^13.1.0
  path: ^1.9.0
  http: ^1.6.0
  flutter_markdown_plus: ^1.0.12
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.1.1
  web_socket_channel: ^3.0.3
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  in_app_review: ^2.0.12
  share_plus: ^13.3.0
  audioplayers: ^6.8.1
  qr: ^4.0.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end widget driving on web (chromedriver) and real devices.
  integration_test:
    sdk: flutter
  # In-memory SQLite for desktop/CI tests (avoids Android/iOS device dependency).
  sqflite_common_ffi: ^2.4.3
  # Already in the tree through drift; named here because the web reload e2e
  # opens the PWA's IndexedDB file with it, as a reload would.
  sqlite3: ^3.6.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Flutter launcher icons - generates app icons for all platforms
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Enable Flutter localization code generation
  generate: true

  # App assets
  assets:
    - store_listing/assets/icon_512.png
    # Shipped game rules, one Markdown file per app locale. Long-form localised
    # content lives here rather than in the ARB files — see .llmwiki/I18n.md.
    - assets/rules/
    # The bundled font's licence, shown on the licence page (registerFontLicenses).
    - assets/fonts/OFL.txt
    # The board's sounds (elimination, victory, turn timer), synthesised by
    # scripts/generate_sounds.py and dedicated to the public domain (CC0 1.0).
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # The app font, bundled rather than fetched: google_fonts downloads from
  # Google at runtime, an outbound data flow the privacy documents do not have.
  # Static instances of the variable font (SIL OFL 1.1, assets/fonts/OFL.txt).
  # Scripts Nunito does not cover (ar, hi, ja, zh) fall back to the system font.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

# Flutter Launcher Icons Configuration
# Every input below is written by scripts/generate_icons.py from the vector
# source in design/icon/ — never edited by hand. See .llmwiki/Release.md.
flutter_launcher_icons:
  android: true
  ios: false
  # the flat, full-bleed icon: the legacy square mipmap and the Play listing
  image_path: "store_listing/assets/icon_512.png"
  # the artwork's own ink, so the tile has the ground the ensemble was drawn on
  adaptive_icon_background: "#0E1716"
  # the same artwork measured into the safe circle — not the full-bleed icon
  adaptive_icon_foreground: "design/icon/adaptive_foreground.png"
  # authored, not derived: flattening the icon to one colour gives a blob
  adaptive_icon_monochrome: "design/icon/adaptive_monochrome.png"
  # 8%, not the package's default 16%: the foreground reaches r=367.8/512, so
  # 8% lands it on Android's 66 dp safe circle instead of well inside it
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
