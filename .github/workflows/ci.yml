name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays 06:17 UTC, on main, with every scope flag true. The `backend` job
  # carries `pip-audit` and the `app` job the osv-scanner audit of pubspec.lock,
  # the two dependency scans that *fail a build* here (Dependabot alerts notify
  # but gate nothing), and neither runs on a pull request that leaves its side
  # alone: this is what caps the exposure window at a week. Same cadence as
  # .github/dependabot.yml.
  #
  # GitHub disables a schedule-only workflow after 60 days of repository inactivity
  # and nothing here goes red when it does, so scripts/check_scheduled_runs.sh
  # watches this trigger (and deps.yml's) from the session-start hook.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a run for a commit already on main,
# so main keeps a complete green/red record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # Which of the five jobs below this change actually needs. Everything here is
  # fail-safe: when this job fails, is cancelled, or writes no output at all,
  # every job runs. It must never be the reason something goes untested.
  scope:
    name: Scope — which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level permissions block *replaces* the workflow's, so contents: read
    # is repeated here — without it actions/checkout fails.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.flags.outputs.backend }}
      image: ${{ steps.flags.outputs.image }}
      app: ${{ steps.flags.outputs.app }}
      android: ${{ steps.flags.outputs.android }}
      sync: ${{ steps.flags.outputs.sync }}
    steps:
      - uses: actions/checkout@v7

      # The classifier decides what is *not* built, so a wrong rule does not fail
      # a build — it merges something nothing tested. The table is the gate, and
      # it runs first: a broken classifier fails this job, which runs all five.
      - name: Scope classifier self-test
        run: scripts/ci_scope_selftest.sh

      # On main, on the weekly run and on a manual run every flag is true: main
      # keeps a complete verification record. On a pull request the flags come
      # from the files it changes.
      #
      # `.filename` — the pulls/{n}/files endpoint has no `path` key, and
      # `-q '.[].path'` would emit one null per file, every null would hit the
      # catch-all rule, and the whole thing would be green forever having saved
      # nothing. `.previous_filename` so a rename is judged on both sides.
      #
      # set -euo pipefail: the default shell is `bash -e` *without* pipefail, so
      # a gh failure inside the pipe would otherwise pass silently. Never add
      # `|| true` to this step — failing here is how everything gets run.
      - name: Which jobs this change needs
        id: flags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all='backend=true\nimage=true\napp=true\nandroid=true\nsync=true\n'
          if [ "$EVENT" != pull_request ]; then
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          n=$(grep -c . "$RUNNER_TEMP/changed.txt" || true)
          echo "$n changed path(s):"
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          # The endpoint stops listing at 3000 files, without an error: past that
          # the list is a lie, so scope nothing out.
          if [ "$n" -ge 3000 ]; then
            echo "::warning::more than 3000 changed files — scoping is off for this run"
            printf "$all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci_scope.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend — ruff, mypy, pytest
    needs: scope
    # Runs unless `scope` succeeded and explicitly said no. A failed, cancelled
    # or output-less `scope` leaves this empty, and '' != 'false', so everything
    # runs — hence `!= 'false'` rather than the weaker `== 'true'`.
    #
    # `!cancelled()` is load-bearing: `needs:` adds an implicit success(), which
    # is only dropped when the expression contains a status function. Without it
    # a failed `scope` would skip this job — and a job skipped by `if:` reports
    # **Success**, which satisfies branch protection. Never a workflow-level
    # `paths:` filter instead: a filtered workflow reports no status at all, and
    # a required check that never reports leaves a pull request waiting forever.
    # The ${{ }} is not cosmetic either — a bare `if: !cancelled()` is invalid
    # YAML, `!` opens a tag, and a workflow that does not parse reports nothing.
    if: ${{ !cancelled() && needs.scope.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Ephemeral runner: nothing needs reaping, and Ryuk is a known flake source.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    # For `alembic check` only. The integration test starts its own Postgres through
    # testcontainers on a random host port, so the two never collide. The job name
    # above is a required check: steps are added here rather than in a new job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs -d cs"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # Depth 2 for the privacy page's **Last Updated** check, which compares against
      # HEAD^1: on a pull request HEAD is the merge commit and HEAD^1 the tip of main,
      # on main HEAD^1 is the commit before the squash.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Matches backend/Dockerfile (python:3.13-slim), i.e. production parity.
          # ruff target-version=py311 and mypy python_version=3.11 are analysis
          # targets and are unaffected by this.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # docs/privacy-policy.html is the page Play links to, rendered from
      # privacy_policy.md by scripts/build_privacy_page.py; #75 and #77 edited the
      # Markdown alone and the published page went two days without their details.
      # Here, and first, because this job is a required check with Python on it and
      # scope routes both files to it; a new job would not be required. pandoc is pinned
      # by version and checksum like osv-scanner: another version renders the same
      # Markdown differently. PANDOC_VERSION moves with build_privacy_page.py and
      # docs/README.md (scripts/test_build_privacy_page.py compares the three).
      - name: Privacy page tests
        working-directory: .
        run: uv run --no-project --with pytest pytest -v scripts/test_build_privacy_page.py

      - name: Privacy page matches privacy_policy.md, and Last Updated moved
        working-directory: .
        env:
          PANDOC_VERSION: "3.6.4"
          PANDOC_SHA256: 5def6e1ff535e397becce292ee97767a947306150b9fb1488003b67ac3417c5e
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/pandoc-$PANDOC_VERSION/bin:$PATH"
          pandoc --version | head -1
          python3 scripts/build_privacy_page.py --check --base HEAD^1

      # --locked fails if uv.lock is stale against pyproject.toml: a free extra gate.
      # --extra dev pulls [project.optional-dependencies].dev (pytest, ruff, mypy);
      # the [dependency-groups].dev group (httpx-ws, testcontainers) is installed by
      # default by `uv sync`. This is why `pip install -e ".[dev]"` cannot be used:
      # it silently misses testcontainers, which the integration test imports.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # Full suite, including the `integration`-marked testcontainers test: the
      # runner has Docker, so postgres:17-alpine really does start. That branch
      # (LISTEN/NOTIFY, JSONB) is covered nowhere else.
      - name: pytest
        run: uv run pytest -v

      # The release tooling's Play API client, on a fake Google service (no network, no
      # key). Here because this job already has uv; the job name is a required check.
      - name: play_publish.py tests
        working-directory: .
        run: uv run --no-project --with pytest --with google-api-python-client --with google-auth pytest -v .claude/skills/release-android/scripts/

      # Every downgrade() must run, and the migrations and the SQLModel models must
      # describe the same schema: migrate an empty Postgres up, all the way down and up
      # again, then let autogenerate compare. Any diff fails, which is what
      # `alembic revision --autogenerate` would otherwise propose silently. Production has
      # no staging: this round trip and backend-deploy's pre-migration dump stand in.
      - name: alembic upgrade, downgrade base, upgrade, check
        env:
          DATABASE_URL: postgresql://cs:pw@localhost:5432/cs
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      # Every locked package — runtime, the dev extra and the dev group — against the
      # PyPI/OSV advisories. Hashes are required, so what is audited is exactly uv.lock.
      # pip-audit rather than `uv audit`, which is still a preview command. A finding
      # with no fix yet gets `--ignore-vuln <ID>` here, with a wip/ entry naming it.
      - name: Dependency vulnerability audit (uv.lock)
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements-txt \
            --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --require-hashes --disable-pip \
            --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

  image:
    name: Backend image — build, non-root, locked
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Every self-hosting user deploys this image. The build itself proves uv.lock is
      # in step with pyproject.toml (--locked); the run proves what the Dockerfile claims.
      - name: Build
        run: docker build -t countscore:ci backend

      - name: Check the image
        run: |
          docker run --rm countscore:ci sh -euc '
            uid=$(id -u)
            [ "$uid" != 0 ] || { echo "runs as root"; exit 1; }
            ! command -v gcc >/dev/null || { echo "a compiler is in the image"; exit 1; }
            ! python -c "import pytest" 2>/dev/null || { echo "dev dependencies are in the image"; exit 1; }
            ! touch /app/app/probe 2>/dev/null || { echo "the code is writable by the service"; exit 1; }
            python -c "import app.main"
            alembic --help >/dev/null
            echo "uid $uid, no compiler, no dev dependencies, read-only code, app imports"
          '

      # The db-backup sidecar (backend/Dockerfile.backup) used to be built only by
      # deploy_nas.sh, so a retired Alpine tag or `age` leaving the 1.2 branch surfaced
      # as a failed production deploy. test_backup_script.py stubs age and pg_dump;
      # this is the only place the real ones are run.
      - name: Build the backup sidecar
        run: docker build -t countscore-backup:ci -f backend/Dockerfile.backup backend

      # pg_dump's major must match the db service (postgres:17-alpine); age must be on
      # the PATH the script calls it from. And with no BACKUP_AGE_RECIPIENT the script
      # must refuse, non-zero: a dump holds every share_token in clear.
      - name: Check the backup sidecar
        run: |
          docker run --rm --entrypoint sh countscore-backup:ci -euc '
            age --version
            pg_dump --version
            pg_dump --version | grep -q " 17\." || { echo "pg_dump is not PostgreSQL 17"; exit 1; }
          '
          if docker run --rm countscore-backup:ci --once; then
            echo "::error file=backend/backup/countscore-backup.sh::--once with no BACKUP_AGE_RECIPIENT exited 0 — it must refuse to dump"
            exit 1
          fi
          echo "the sidecar refuses to dump without a recipient"

      # `config` exits 0 on an unset variable and only warns, so any stderr fails the
      # step: the dummy values below are exactly the variables the production file
      # requires, and a new one without a `:-default` must be added here on purpose.
      # The dev file reads backend/.env, which is gitignored; .env.example stands in.
      - name: Compose files resolve
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cs
          CORS_ORIGINS: https://ci.invalid
        run: |
          docker compose -f backend/docker-compose.prod.yml config --quiet 2> "$RUNNER_TEMP/prod.err"
          cp backend/.env.example backend/.env
          env -u POSTGRES_USER -u POSTGRES_PASSWORD -u POSTGRES_DB -u CORS_ORIGINS \
            docker compose -f backend/docker-compose.yml config --quiet 2> "$RUNNER_TEMP/dev.err"
          for f in prod dev; do
            if [ -s "$RUNNER_TEMP/$f.err" ]; then
              cat "$RUNNER_TEMP/$f.err"
              echo "::error::docker compose config warned on the $f compose file"
              exit 1
            fi
          done
          echo "docker-compose.prod.yml and docker-compose.yml resolve with no warning"

  app:
    name: App — codegen, analyze, test, web build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Claude Code hooks decide from a parsed command line; the table in this
      # script is what keeps a rule change from silently breaking one of them. It
      # needs neither Flutter nor Python packages, so it runs first and fails fast.
      - name: Claude Code hooks self-test
        run: scripts/hooks_selftest.sh

      # The check both publishing paths run on build/web (deploy_web.sh, deploy-pages.yml)
      # refuses a stray Markdown file or a missing runtime file; its refusals are pinned
      # against fixture builds here, and the release web build below goes through it.
      - name: Web build check self-test
        run: scripts/check_web_build_selftest.sh

      # The pub twin of the backend's pip-audit: every package pubspec.lock resolves,
      # direct and transitive, against OSV (GitHub advisories included). Any advisory
      # fails the job; `dart pub audit` does not exist. The binary is pinned by version
      # and checksum, like pip-audit's `uvx` pin. osv-scanner has no --ignore-vuln flag:
      # an advisory with no fix yet goes in .github/osv-scanner.toml ([[IgnoredVulns]])
      # with a wip/ entry naming it, never left red. Needs no Flutter, so it runs early.
      - name: Dependency vulnerability audit (pubspec.lock)
        env:
          OSV_VERSION: "2.6.0"
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --all-vulns \
            --config .github/osv-scanner.toml --lockfile pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      # `flutter: generate: true` + l10n.yaml means gen-l10n runs here
      # automatically; no separate `flutter gen-l10n` step is needed.
      - name: flutter pub get
        run: flutter pub get

      # web/drift_worker.js and web/sqlite3.wasm are committed and must follow the
      # versions pubspec.lock resolves; nothing compared them, so Dependabot #43
      # merged green with the previous worker. It sits here because it needs the
      # pub cache `pub get` just populated, and nothing more: a stale binary fails
      # in seconds rather than after codegen, analyze, test and a web build.
      - name: Web binaries match pubspec.lock
        run: scripts/web_binaries.sh --check

      # THIRD_PARTY_LICENSES.md is generated from pubspec.yaml's direct dependencies and
      # each one's LICENSE in the pub cache `pub get` just populated; the hand-written
      # file had drifted a year behind pubspec.yaml. Stdlib Python: uv only runs it.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Third-party licences tests
        run: uv run --no-project --with pytest pytest -v scripts/test_third_party_licenses.py

      - name: THIRD_PARTY_LICENSES.md matches pubspec.yaml
        run: uv run --no-project scripts/third_party_licenses.py --check

      # Scheduled only: proves the committed wasm still matches the bytes GitHub
      # serves, which is what catches a re-cut upstream release. `|| [ $? -eq 3 ]`
      # swallows an environment failure (no network, GitHub down) while a real
      # mismatch, which exits 1, still fails the job.
      - name: Web binaries match upstream (scheduled)
        if: github.event_name == 'schedule'
        run: scripts/web_binaries.sh --fetch || [ $? -eq 3 ]

      # MANDATORY, and it must precede analyze/test/build: *.g.dart is gitignored,
      # so lib/services/drift/database.g.dart does not exist in a fresh clone.
      # Do NOT add --delete-conflicting-outputs: build_runner 2.16 removed it.
      - name: Code generation (drift)
        run: dart run build_runner build

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # --no-tree-shake-icons is mandatory on every build target: game-type icons
      # are built from database codepoints, which the tree-shaker cannot see.
      # No --dart-define=BACKEND_URL: the backend URL is a runtime setting with
      # no default, and this job only proves the build compiles.
      - name: Build web (release)
        run: flutter build web --release --no-tree-shake-icons

      - name: The web build is publishable
        run: scripts/check_web_build.sh build/web

  # The only test that drives the Flutter client against the real server contract:
  # FastAPI on a real Postgres (LISTEN/NOTIFY, JSONB), migrated by Alembic, two
  # in-memory devices. Mirrors .llmwiki/Testing.md, "Group sync against a local backend".
  sync:
    name: Sync — two devices against a real backend
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.sync != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: cs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs -d cs"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # Runtime dependencies only: uvicorn, alembic and both Postgres drivers are
      # in [project].dependencies.
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Migrate the database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://cs:pw@localhost:5432/cs
        run: uv run alembic upgrade head

      # Every test creates a group and pushes several batches from one address, so
      # the per-IP group limit (3/min) and the push limit would refuse the suite.
      # The venv's uvicorn, not `uv run uvicorn`: a `uv run` parent stays alive with the
      # server and holds the uv cache lock, so setup-uv's post-job `uv cache prune --ci`
      # (run whenever uv.lock changed and the cache is re-saved) waited 300 s and failed
      # the job. The server is also stopped explicitly in the last step.
      - name: Start the backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cs:pw@localhost:5432/cs
          GROUP_RL_PER_MINUTE: "1000"
          GROUP_RL_PER_HOUR: "10000"
          SYNC_PUSH_RL_PER_MINUTE: "1000"
        run: |
          nohup .venv/bin/uvicorn app.main:app --port 8765 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8765/health && exit 0
            sleep 1
          done
          echo "::error::the backend did not answer /health within 60 s"
          cat uvicorn.log
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      # SYNC_TEST_REQUIRED turns the test's skip-without-URL into a failure, so this
      # job cannot pass green having run nothing.
      - name: Two-device sync test
        env:
          SYNC_BACKEND_URL: http://127.0.0.1:8765
          SYNC_TEST_REQUIRED: "true"
        run: flutter test test/sync/sync_two_devices_test.dart

      - name: Backend log
        if: failure()
        run: cat backend/uvicorn.log || true

      - name: Stop the backend
        if: always()
        run: kill "$(cat backend/uvicorn.pid)" 2>/dev/null || true

  android:
    name: Android debug APK — fresh-clone build proof
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # Covers ~/.gradle/caches and ~/.gradle/wrapper — the big win, since the
          # Gradle 9.3.1 distribution alone is ~200 MB. Deliberately not using
          # gradle/actions/setup-gradle: it expects a wrapper at checkout time,
          # but android/gradlew is gitignored until the Flutter tool injects it.
          cache: gradle

      # android/gradle.properties asks for -Xmx8G -XX:MaxMetaspaceSize=4G, more
      # than a standard runner has. gradle.properties in GRADLE_USER_HOME takes
      # precedence over the project's, so this caps the heap without touching the
      # committed file. Written after setup-java, whose cache only covers
      # ~/.gradle/caches and ~/.gradle/wrapper.
      - name: Cap the Gradle heap for CI
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "org.gradle.workers.max=2"
          } >> "$HOME/.gradle/gradle.properties"

      # AGP 9.1 needs compileSdk 36 and build-tools 36.0.0. Accepting the licences
      # also lets AGP auto-download the pinned NDK if the image lacks it.
      - name: Install pinned Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Code generation (drift)
        run: dart run build_runner build

      # Debug, not release: release signing reads android/key.properties, which is
      # gitignored and absent in CI by design. Never invoke ./gradlew directly —
      # android/settings.gradle.kts requires flutter.sdk in local.properties, and
      # only `flutter build` writes that file.
      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      # This job builds debug, and the debug manifest declares INTERNET for hot
      # reload — so no build here can catch a release manifest that does not. The
      # assertion is on the source manifest instead: without it, the ZapZap
      # analysis fails with a SocketException in every signed release build.
      - name: Prove the release manifest declares INTERNET
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || {
            echo "::error file=android/app/src/main/AndroidManifest.xml::the main manifest must declare INTERNET — src/debug and src/profile are not merged into a release build, so the ZapZap analysis would fail at runtime in the store binary"
            exit 1
          }

      # gradlew and gradle-wrapper.jar are gitignored; the Flutter tool injects
      # them. Asserting that on a clean checkout is half the point of this job.
      - name: Prove the Gradle wrapper was injected into a clean checkout
        run: |
          ls -l android/gradlew android/gradle/wrapper/gradle-wrapper.jar
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
