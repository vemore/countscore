# Local full-stack compose (db + api + daily backup) for development/testing.
# Production deploys to the Synology NAS via docker-compose.prod.yml — see README.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The whole .env reaches the container, so every setting in app/config.py —
    # LLM_PROVIDER and the provider credentials included — works without being listed
    # here. An explicit list silently dropped them. Defaults live in app/config.py.
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env: inside compose the database host is `db`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # backup/countscore-backup.sh, baked into Dockerfile.backup: daily at 03:00 UTC,
    # pg_dump -Fc | gzip | age -r $BACKUP_AGE_RECIPIENT into backups/*.dump.gz.age,
    # 7-day retention. Without BACKUP_AGE_RECIPIENT it refuses to dump and exits non-zero:
    # a dump holds every share_token in clear, so there is no plaintext fallback.
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # age public key (age1...). The private key never goes on the server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backups:/backups

volumes:
  db_data:
