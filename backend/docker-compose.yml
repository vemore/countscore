# Local full-stack compose (db + api + daily backup) for development/testing.
# Production deploys to the Synology NAS via docker-compose.prod.yml — see README.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COMMENT_MODEL: ${COMMENT_MODEL:-claude-haiku-4-5}
      DEFAULT_BUDGET_CENTS: ${DEFAULT_BUDGET_CENTS:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Daily pg_dump at 03:00 UTC, gzip, retain 7 days.
    # BusyBox 'date' (postgres:17-alpine) has no GNU "-d 'tomorrow 03:00'", so we
    # compute the delay to the next 03:00 from the epoch (seconds-since-midnight,
    # UTC) instead. Sleep-then-dump keeps the loop idle between runs.
    command: |
      "
      target=10800;
      while true; do
        secs=$$(( $$(date +%s) % 86400 ));
        if [ $$secs -le $$target ]; then delay=$$((target - secs)); else delay=$$((86400 - secs + target)); fi;
        sleep $$delay;
        ts=$$(date +%Y%m%d_%H%M%S);
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc | gzip > /backups/countscore_$$ts.sql.gz;
        find /backups -name 'countscore_*.sql.gz' -mtime +7 -delete;
        echo 'Backup done: countscore_'$$ts'.sql.gz';
      done
      "

volumes:
  db_data:
