# Production compose for the Synology NAS. Copied to the NAS as compose.yaml by
# scripts/deploy_nas.sh. No Caddy/TLS here: Synology Web Station terminates TLS and
# reverse-proxies https://countscore.ombivince.synology.me/ -> http://localhost:8087.
# The API is bound to 127.0.0.1 so only Web Station (on the NAS) can reach it.
services:
  db:
    image: postgres:17-alpine
    container_name: countscore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: localhost:5050/countscore:latest
    container_name: countscore
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Single worker: the per-IP rate limiter keeps state in process memory.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMMENT_MODEL: ${COMMENT_MODEL:-claude-haiku-4-5}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.meta.llama3-3-70b-instruct-v1:0}
      CORS_ORIGINS: ${CORS_ORIGINS}
      IP_RL_PER_MINUTE: ${IP_RL_PER_MINUTE:-5}
      IP_RL_PER_HOUR: ${IP_RL_PER_HOUR:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8087:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-backup:
    image: postgres:17-alpine
    container_name: countscore-db-backup
    restart: unless-stopped
    user: "1027:100"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Daily pg_dump at 03:00 UTC, gzip, retain 7 days.
    # BusyBox 'date' (postgres:17-alpine) has no GNU "-d 'tomorrow 03:00'", so we
    # compute the delay to the next 03:00 from the epoch (seconds-since-midnight,
    # UTC) instead. Sleep-then-dump keeps the loop idle between runs.
    command: |
      "
      target=10800;
      while true; do
        secs=$$(( $$(date +%s) % 86400 ));
        if [ $$secs -le $$target ]; then delay=$$((target - secs)); else delay=$$((86400 - secs + target)); fi;
        sleep $$delay;
        ts=$$(date +%Y%m%d_%H%M%S);
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc | gzip > /backups/countscore_$$ts.sql.gz;
        find /backups -name 'countscore_*.sql.gz' -mtime +7 -delete;
        echo 'Backup done: countscore_'$$ts'.sql.gz';
      done
      "

volumes:
  db_data:
