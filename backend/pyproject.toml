[project]
name = "countscore-backend"
version = "0.1.0"
description = "CountScore backend: groups, offline-first sync, Claude-powered comments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlmodel>=0.0.42",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.19.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "anthropic>=1.4,<2",
    "boto3>=1.43.90",
    "openai>=2,<3",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "N805"]

[tool.ruff.lint.per-file-ignores]
# zapzap_prompt.py holds the verbatim "Professeur Claude" system prompt as a
# multi-line French string literal: wrapping lines would corrupt the prompt (E501)
# and it legitimately uses typographic glyphs like × and — (RUF001).
"app/services/zapzap_prompt.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker / real Postgres (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "httpx-ws>=0.9.0",
    "testcontainers[postgres]>=4.15.0",
]
